<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>移动端测试原型</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui;background:#f5f7fa}main{width:100%;min-height:100%;background:#fff}.page{min-height:100vh;padding:20px}.bar{display:flex;gap:8px}.card{margin-top:16px;padding:16px;border:1px solid #dde3ea;border-radius:6px}button{min-height:40px;padding:0 14px}.dialog{position:fixed;inset:25% 24px auto;padding:20px;border:1px solid #ccd4df;background:#fff;box-shadow:0 12px 30px #0002}
  </style>
</head>
<body>
  <main data-proto-app data-proto-platform="mobile">
    <section class="page" data-proto-scope="page:home" data-proto-layer="0">
      <h1>移动首页</h1>
      <div class="bar"><button data-proto-route="page:detail" data-page-link="detail">查看详情</button><button data-proto-route="dialog:confirm" data-dialog-open>打开弹窗</button></div>
      <div class="card"><strong>首页卡片</strong><p>移动端原始内容</p></div>
    </section>
    <section class="page" data-proto-scope="page:detail" data-proto-layer="0" hidden>
      <h1>详情页</h1><button data-proto-route="page:home" data-page-link="home">返回首页</button>
    </section>
    <section class="dialog" data-proto-scope="dialog:confirm" data-proto-layer="30" hidden><strong>确认弹窗</strong><button data-dialog-close>关闭</button></section>
  </main>
  <script>
    function showPage(id){document.querySelectorAll('[data-proto-scope^="page:"]').forEach(page=>page.hidden=page.dataset.protoScope!==`page:${id}`)}
    document.addEventListener('click',event=>{const page=event.target.closest('[data-page-link]');if(page)showPage(page.dataset.pageLink);if(event.target.closest('[data-dialog-open]'))document.querySelector('[data-proto-scope="dialog:confirm"]').hidden=false;if(event.target.closest('[data-dialog-close]'))document.querySelector('[data-proto-scope="dialog:confirm"]').hidden=true})
  </script>
</body>
</html>
